<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="robots" content="noindex"></head>
<body>
<!-- Hidden static form so Netlify's build bot always registers "media-day-booking".
     The live, styled form lives on media-day.html. Field names must match exactly. -->
<form name="media-day-booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="media-day-booking">
  <input name="bot-field">
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="text" name="phone">
  <input type="text" name="role">
  <input type="text" name="school">
  <input type="text" name="sport">
  <input type="text" name="athlete_count">
  <input type="text" name="timing">
  <textarea name="vision"></textarea>
</form>
</body>
</html>
