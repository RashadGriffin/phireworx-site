<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,0 20,10 31,7 25,16 28,27 16,22 4,27 7,16 1,7 12,10' fill='%23FF5A1F'/></svg>">
<style id="mobile-menu-styles">
/* NAV — always on top */
#nav { z-index: 2147483645 !important; }

/* HAMBURGER — always visible above menu */
#hamburger {
  position: relative !important;
  z-index: 2147483647 !important;
  cursor: pointer !important;
  touch-action: manipulation !important;
  -webkit-tap-highlight-color: transparent !important;
  display: none !important;
}
@media (max-width: 768px) {
  #hamburger { display: flex !important; }
}

/* FULLSCREEN MENU — starts below nav bar */
#nav-mobile {
  display: none !important;
  position: fixed !important;
  top: 68px !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 100vw !important;
  height: calc(100vh - 68px) !important;
  z-index: 2147483644 !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
  align-items: flex-start !important;
  background: #0d0d0d !important;
  padding: 32px 28px 40px !important;
  gap: 0 !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch !important;
  box-sizing: border-box !important;
}
#nav-mobile.open { display: flex !important; }

/* Main nav links — large, amber on tap */
#nav-mobile > a {
  font-size: 30px !important;
  font-weight: 700 !important;
  font-style: italic !important;
  font-family: 'Rajdhani', sans-serif !important;
  text-transform: uppercase !important;
  color: #ffffff !important;
  padding: 16px 0 !important;
  border-bottom: 1px solid rgba(255,255,255,0.07) !important;
  width: 100% !important;
  display: block !important;
  text-decoration: none !important;
  letter-spacing: 0.01em !important;
  line-height: 1 !important;
}
#nav-mobile > a:first-child { color: #FFB347 !important; }
#nav-mobile > a:active { color: #FFB347 !important; }

/* Book Now CTA button */
#nav-mobile a.nav-mobile-cta {
  background: #FFB347 !important;
  color: #000000 !important;
  text-align: center !important;
  padding: 16px !important;
  margin-top: 28px !important;
  border: none !important;
  font-size: 13px !important;
  letter-spacing: 0.12em !important;
  display: block !important;
  width: 100% !important;
  border-bottom: none !important;
}

/* Services trigger button */
.nav-mobile-services-trigger {
  font-size: 30px !important;
  font-weight: 700 !important;
  font-style: italic !important;
  font-family: 'Rajdhani', sans-serif !important;
  text-transform: uppercase !important;
  color: #ffffff !important;
  padding: 16px 0 !important;
  border-bottom: 1px solid rgba(255,255,255,0.07) !important;
  border-top: none !important;
  border-left: none !important;
  border-right: none !important;
  background: none !important;
  width: 100% !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
  cursor: pointer !important;
  letter-spacing: 0.01em !important;
}
.nav-mobile-services-trigger.open { color: #FFB347 !important; }

/* Services sub-menu — amber accent links */
#mob-svc-sub {
  display: none !important;
  flex-direction: column !important;
  padding: 8px 0 8px 16px !important;
  gap: 0 !important;
  border-bottom: 1px solid rgba(255,255,255,0.07) !important;
}
#mob-svc-sub.open { display: flex !important; }
#mob-svc-sub a {
  font-size: 17px !important;
  font-style: italic !important;
  color: #FFB347 !important;
  padding: 12px 0 !important;
  border-bottom: 1px solid rgba(255,179,71,0.12) !important;
  font-weight: 600 !important;
  letter-spacing: 0.04em !important;
}
#mob-svc-sub a:last-child { border-bottom: none !important; }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="/index.html" class="nav-logo" aria-label="Phireworx Photography Home">
      <div class="nav-logo-mark" aria-hidden="true"></div>
      <span class="nav-logo-text"><span>P</span>HIREWORX</span>
    </a>
    <div class="nav-right">
      <a href="/book" class="nav-cta">Book Now</a>
      <button class="nav-hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<section style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem;">
  <div>
    <div style="font-family:'Exo 2',sans-serif;font-size:8rem;font-weight:900;color:var(--ember);line-height:1;margin-bottom:1rem;">404</div>
    <h1 style="font-size:2rem;margin-bottom:1rem;">Page Not Found</h1>
    <p style="color:var(--mist);max-width:400px;margin:0 auto 2rem;">Looks like this shot didn't make the gallery. Let's get you back on the field.</p>
    <a href="/index.html" class="btn-primary">Back to Home</a>
  </div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <p style="color:var(--mist);font-size:0.875rem;">&copy; 2025 Phireworx Photography · Phoenix, AZ</p>
  </div>
</footer>


<!-- LIGHTBOX -->
<div class="lb-overlay" id="lb-overlay">
  <span class="lb-close" id="lb-close">&times;</span>
  <span class="lb-prev" id="lb-prev">&#8249;</span>
  <div class="lb-img-wrap">
    <img src="" alt="" id="lb-img">
  </div>
  <span class="lb-next" id="lb-next">&#8250;</span>
</div>

<script id="mobile-menu-js">
(function() {
  var hamburger = document.getElementById('hamburger');
  var navMobile = document.getElementById('nav-mobile');
  if (!hamburger || !navMobile) return;

  var spans = hamburger.querySelectorAll('span');

  function openMenu() {
    navMobile.classList.add('open');
    hamburger.setAttribute('aria-expanded', 'true');
    if (spans[0]) spans[0].style.cssText = 'transform:rotate(45deg) translate(5px,5px);transition:all 0.2s';
    if (spans[1]) spans[1].style.cssText = 'opacity:0;transition:all 0.2s';
    if (spans[2]) spans[2].style.cssText = 'transform:rotate(-45deg) translate(5px,-5px);transition:all 0.2s';
  }

  function closeMenu() {
    navMobile.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
    if (spans[0]) spans[0].style.cssText = 'transition:all 0.2s';
    if (spans[1]) spans[1].style.cssText = 'transition:all 0.2s';
    if (spans[2]) spans[2].style.cssText = 'transition:all 0.2s';
  }

  hamburger.addEventListener('click', function(e) {
    e.stopPropagation();
    navMobile.classList.contains('open') ? closeMenu() : openMenu();
  });

  navMobile.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', closeMenu);
  });

  var mobTrigger = document.getElementById('mob-svc-trigger');
  var mobSub = document.getElementById('mob-svc-sub');
  if (mobTrigger && mobSub) {
    mobTrigger.addEventListener('click', function(e) {
      e.stopPropagation();
      mobTrigger.classList.toggle('open');
      mobSub.classList.toggle('open');
    });
  }

  var ddLi = document.querySelector('.nav-dropdown');
  var ddMenu = document.querySelector('.nav-dropdown-menu');
  var ddTimer;
  if (ddLi && ddMenu) {
    ddLi.addEventListener('mouseenter', function() { clearTimeout(ddTimer); ddLi.classList.add('is-open'); });
    ddLi.addEventListener('mouseleave', function() { ddTimer = setTimeout(function() { ddLi.classList.remove('is-open'); }, 150); });
    ddMenu.addEventListener('mouseenter', function() { clearTimeout(ddTimer); });
    ddMenu.addEventListener('mouseleave', function() { ddTimer = setTimeout(function() { ddLi.classList.remove('is-open'); }, 150); });
  }
})();
</script>
</body>
</html>
