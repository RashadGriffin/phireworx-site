# Phireworx /admin
# Every field here is wired to the live site (assets/js/cms.js reads these files).
# Add a field only together with a data-cms binding on the page.

backend:
  name: git-gateway
  branch: main
media_folder: assets/images
public_folder: /assets/images
collections:
- name: homepage
  label: Homepage
  editor:
    preview: false
  files:
  - name: homepage
    label: 'Homepage: Headline & Stats'
    file: data/homepage.json
    format: json
    fields:
    - label: Line under "Est. 2012"
      name: hero_eyebrow
      widget: string
    - label: Headline line 1
      name: hero_line1
      widget: string
    - label: Headline line 2
      name: hero_line2
      widget: string
    - label: Headline line 3
      name: hero_line3
      widget: string
    - label: Text under the headline
      name: hero_sub
      widget: text
    - label: Main button text
      name: hero_btn1
      widget: string
    - label: Second button text
      name: hero_btn2
      widget: string
    - label: Stat 1 number
      name: stat1_num
      widget: string
      pattern: &id001
      - ^[0-9][0-9,.]*$
      - Numbers only, no $ sign
    - label: Stat 1 after the number (like + or %)
      name: stat1_suffix
      widget: string
      required: false
    - label: Stat 1 label
      name: stat1_label
      widget: string
    - label: Stat 2 number
      name: stat2_num
      widget: string
      pattern: *id001
    - label: Stat 2 after the number
      name: stat2_suffix
      widget: string
      required: false
    - label: Stat 2 label
      name: stat2_label
      widget: string
    - label: Stat 3 number (shows with a star)
      name: stat3_num
      widget: string
      pattern: *id001
    - label: Stat 3 label
      name: stat3_label
      widget: string
    - label: Stat 4 number
      name: stat4_num
      widget: string
      pattern: *id001
    - label: Stat 4 after the number
      name: stat4_suffix
      widget: string
      required: false
    - label: Stat 4 label
      name: stat4_label
      widget: string
- name: prices
  label: Prices
  editor:
    preview: false
  files:
  - name: prices
    label: All Prices
    file: data/prices.json
    format: json
    fields:
    - label: Pro Banners
      name: banners
      widget: object
      collapsed: true
      fields:
      - label: Individual 2×3 ft
        name: individual_2x3
        widget: string
        pattern: *id001
        hint: Also the "from" price on the Banners and Services pages
      - label: Individual 2.5×4 ft
        name: individual_25x4
        widget: string
        pattern: *id001
      - label: Individual 3×5 ft
        name: individual_3x5
        widget: string
        pattern: *id001
      - label: Individual 4×6 ft
        name: individual_4x6
        widget: string
        pattern: *id001
      - label: Traditional team 5×3 ft
        name: team_5x3
        widget: string
        pattern: *id001
      - label: Traditional team 6×4 ft
        name: team_6x4
        widget: string
        pattern: *id001
      - label: Traditional team 7×5 ft
        name: team_7x5
        widget: string
        pattern: *id001
      - label: Traditional team 10×6 ft
        name: team_10x6
        widget: string
        pattern: *id001
      - label: Composite team 5×3 ft
        name: composite_5x3
        widget: string
        pattern: *id001
      - label: Composite team 6×4 ft
        name: composite_6x4
        widget: string
        pattern: *id001
      - label: Composite team 7×5 ft
        name: composite_7x5
        widget: string
        pattern: *id001
      - label: Composite team 10×6 ft
        name: composite_10x6
        widget: string
        pattern: *id001
      - label: Extra per banner on orders of 1–3
        name: small_order_upcharge
        widget: string
        pattern: *id001
      - label: Banner-only minimum order
        name: minimum_order
        widget: string
        pattern: *id001
      - label: Shipping charge
        name: shipping
        widget: string
        pattern: *id001
      - label: Free shipping at
        name: free_shipping_at
        widget: string
        pattern: *id001
    - label: Media Day
      name: media_day
      widget: object
      collapsed: true
      fields:
      - label: Per athlete, 20+ athletes
        name: tier_20_plus
        widget: string
        pattern: *id001
        hint: Also the "starting at" price on the Services and Booking pages
      - label: Per athlete, 10–19 athletes
        name: tier_10_19
        widget: string
        pattern: *id001
      - label: Per athlete, 5–9 athletes
        name: tier_5_9
        widget: string
        pattern: *id001
      - label: Minimum booking
        name: minimum
        widget: string
        pattern: *id001
    - label: Picture Day
      name: picture_day
      widget: object
      collapsed: true
      fields:
      - label: Small-program session fee
        name: small_program_fee
        widget: string
        pattern: *id001
      - label: High school athlete minimum (no fee at or above)
        name: hs_min_athletes
        widget: string
        pattern: *id001
      - label: Youth/club athlete minimum (no fee at or above)
        name: youth_min_athletes
        widget: string
        pattern: *id001
    - label: Team Media Images
      name: team_media
      widget: object
      collapsed: true
      fields:
      - label: Per image, 1–9 images
        name: per_image_1_9
        widget: string
        pattern: *id001
      - label: Per image, 10–19 images
        name: per_image_10_19
        widget: string
        pattern: *id001
      - label: Per image, 20+ images
        name: per_image_20_plus
        widget: string
        pattern: *id001
      - label: Hi-res upgrade per image
        name: hires_upgrade
        widget: string
        pattern: *id001
      - label: PNG cutout per image
        name: png_cutout
        widget: string
        pattern: *id001
      - label: Player headshots, full team
        name: headshots_flat
        widget: string
        pattern: *id001
    - label: Private Sessions (Signature packages)
      name: private_sessions
      widget: object
      collapsed: true
      fields:
      - label: Packages
        name: packages
        widget: list
        allow_add: false
        allow_remove: false
        label_singular: Package
        summary: '{{fields.name}}: ${{fields.price}}'
        hint: The four package cards, in order.
        fields:
        - label: Package name
          name: name
          widget: string
        - label: Price
          name: price
          widget: string
          pattern: *id001
        - label: What's included
          name: items
          widget: list
          field:
            label: Line
            name: item
            widget: string
  description: Every price on the site. Change a number here and it updates on every page that shows it. Numbers only, no $ sign.
