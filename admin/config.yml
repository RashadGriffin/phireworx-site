- name: reviews
  label: Reviews
  folder: data/reviews
  create: true
  slug: '{{slug}}'
  label_singular: Review
  format: json
  summary: '{{name}} — {{role}}'
  fields:
  - label: Reviewer Name
    name: name
    widget: string
  - label: Role / Organization
    name: role
    widget: string
  - label: Review Text
    name: quote
    widget: text
    hint: Do not include quotation marks
  - label: Star Rating
    name: stars
    widget: number
    default: 5
    value_type: int
    min: 1
    max: 5
  - label: Show on Homepage
    name: homepage
    widget: boolean
    default: false
  - label: Show on Reviews Page
    name: reviews_page
    widget: boolean
    default: true
- name: faq
  label: FAQ
  files:
  - name: faq
    label: FAQ Content
    file: data/faq.json
    format: json
    fields:
    - label: Page Subheadline
      name: sub
      widget: text
    - label: FAQ Categories
      name: categories
      widget: list
      label_singular: Category
      fields:
      - label: Category Name
        name: category
        widget: string
      - label: Questions
        name: questions
        widget: list
        label_singular: Question
        fields:
        - label: Question
          name: q
          widget: string
        - label: Answer
          name: a
          widget: text
