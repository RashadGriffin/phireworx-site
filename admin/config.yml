backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  # ── HOMEPAGE ──
  - name: "homepage"
    label: "🏠 Homepage"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "data/homepage.json"
        format: json
        fields:
          - { label: "Hero Eyebrow", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero Line 1 (white)", name: "hero_line1", widget: "string" }
          - { label: "Hero Line 2 (amber)", name: "hero_line2", widget: "string" }
          - { label: "Hero Line 3 (white)", name: "hero_line3", widget: "string" }
          - { label: "Hero Subheadline", name: "hero_sub", widget: "text" }
          - { label: "Primary Button Text", name: "hero_btn1", widget: "string" }
          - { label: "Secondary Button Text", name: "hero_btn2", widget: "string" }
          - { label: "Stat 1 — Number", name: "stat1_num", widget: "string" }
          - { label: "Stat 1 — Suffix", name: "stat1_suffix", widget: "string" }
          - { label: "Stat 1 — Label", name: "stat1_label", widget: "string" }
          - { label: "Stat 2 — Number", name: "stat2_num", widget: "string" }
          - { label: "Stat 2 — Suffix", name: "stat2_suffix", widget: "string" }
          - { label: "Stat 2 — Label", name: "stat2_label", widget: "string" }
          - { label: "Stat 3 — Number", name: "stat3_num", widget: "string" }
          - { label: "Stat 3 — Suffix", name: "stat3_suffix", widget: "string" }
          - { label: "Stat 3 — Label", name: "stat3_label", widget: "string" }
          - { label: "Stat 4 — Number", name: "stat4_num", widget: "string" }
          - { label: "Stat 4 — Suffix", name: "stat4_suffix", widget: "string" }
          - { label: "Stat 4 — Label", name: "stat4_label", widget: "string" }
          - label: "How It Works Steps"
            name: "process_steps"
            widget: "list"
            label_singular: "Step"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

  # ── REVIEWS ──
  - name: "reviews"
    label: "⭐ Reviews"
    folder: "data/reviews"
    create: true
    slug: "{{slug}}"
    label_singular: "Review"
    format: json
    summary: "{{name}} — {{role}}"
    fields:
      - { label: "Reviewer Name", name: "name", widget: "string" }
      - { label: "Role / Organization", name: "role", widget: "string" }
      - { label: "Review Text", name: "quote", widget: "text", hint: "Do not include quotation marks" }
      - { label: "Star Rating", name: "stars", widget: "number", default: 5, value_type: "int", min: 1, max: 5 }
      - { label: "Show on Homepage", name: "homepage", widget: "boolean", default: false }
      - { label: "Show on Reviews Page", name: "reviews_page", widget: "boolean", default: true }

  # ── PHOTO DAY ──
  - name: "photo_day"
    label: "📸 Photo Day Page"
    files:
      - name: "photo_day"
        label: "Photo Day Content"
        file: "data/photo-day.json"
        format: json
        fields:
          - { label: "Hero Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Hero Headline", name: "headline", widget: "string" }
          - { label: "Hero Subheadline", name: "sub", widget: "text" }
          - label: "How It Works Steps"
            name: "steps"
            widget: "list"
            label_singular: "Step"
            fields:
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "desc", widget: "text" }
          - label: "EZ Ordering Features"
            name: "features"
            widget: "list"
            label_singular: "Feature"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Shoot Style Cards"
            name: "styles"
            widget: "list"
            label_singular: "Style"
            fields:
              - { label: "Style Name", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

  # ── MEDIA DAY ──
  - name: "media_day"
    label: "🎬 Media Day Page"
    files:
      - name: "media_day"
        label: "Media Day Content"
        file: "data/media-day.json"
        format: json
        fields:
          - { label: "Hero Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Hero Headline", name: "headline", widget: "string" }
          - { label: "Hero Subheadline", name: "sub", widget: "text" }
          - { label: "Core Section Heading", name: "core_heading", widget: "string" }
          - { label: "Core Section Body", name: "core_body", widget: "text" }
          - label: "Gallery Images"
            name: "gallery"
            widget: "list"
            label_singular: "Image"
            hint: "Add, remove, or reorder gallery photos. Recommended: 7 images."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", hint: "Describe the photo for accessibility" }
              - { label: "Wide (spans 2 columns)", name: "wide", widget: "boolean", default: false }
          - label: "What You Get Items"
            name: "what_you_get"
            widget: "list"
            label_singular: "Item"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Ideal Programs"
            name: "ideal_programs"
            widget: "list"
            label_singular: "Program"
            fields:
              - { label: "Program Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "How It Works Steps"
            name: "steps"
            widget: "list"
            label_singular: "Step"
            fields:
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "desc", widget: "text" }

  # ── BANNERS ──
  - name: "banners"
    label: "🖼️ Banners Page"
    files:
      - name: "banners"
        label: "Banners Content"
        file: "data/banners.json"
        format: json
        fields:
          - { label: "Hero Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Hero Headline", name: "headline", widget: "string" }
          - { label: "Hero Subheadline", name: "sub", widget: "text" }
          - label: "Banner Types"
            name: "types"
            widget: "list"
            label_singular: "Type"
            fields:
              - { label: "Type Name", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Starting Price", name: "price", widget: "string" }

  # ── BOOKING ──
  - name: "booking"
    label: "📅 Booking Page"
    files:
      - name: "booking"
        label: "Booking Content"
        file: "data/booking.json"
        format: json
        fields:
          - { label: "Page Headline", name: "headline", widget: "string" }
          - { label: "Page Subheadline", name: "sub", widget: "text" }
          - { label: "HS Card Eyebrow", name: "hs_eyebrow", widget: "string" }
          - { label: "HS Card Title", name: "hs_title", widget: "string" }
          - { label: "HS Card Description", name: "hs_desc", widget: "text" }
          - { label: "Youth Card Eyebrow", name: "youth_eyebrow", widget: "string" }
          - { label: "Youth Card Title", name: "youth_title", widget: "string" }
          - { label: "Youth Card Description", name: "youth_desc", widget: "text" }
          - label: "What Happens Next Steps"
            name: "next_steps"
            widget: "list"
            label_singular: "Step"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }

  # ── SERVICES ──
  - name: "services"
    label: "📋 Services Page"
    files:
      - name: "services"
        label: "Services Content"
        file: "data/services.json"
        format: json
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Headline", name: "headline", widget: "string" }
          - { label: "Page Subheadline", name: "sub", widget: "text" }
          - label: "Services"
            name: "services"
            widget: "list"
            label_singular: "Service"
            fields:
              - { label: "Number", name: "number", widget: "string", hint: "e.g. 01" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Sub-heading", name: "sub", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - label: "Feature Bullets"
                name: "features"
                widget: "list"
                label_singular: "Feature"
                field: { label: "Feature", name: "item", widget: "string" }

  # ── FAQ ──
  - name: "faq"
    label: "❓ FAQ Page"
    files:
      - name: "faq"
        label: "FAQ Content"
        file: "data/faq.json"
        format: json
        fields:
          - { label: "Page Headline", name: "headline", widget: "string" }
          - { label: "Page Subheadline", name: "sub", widget: "text" }
          - label: "FAQ Categories"
            name: "categories"
            widget: "list"
            label_singular: "Category"
            fields:
              - { label: "Category Name", name: "category", widget: "string" }
              - label: "Questions"
                name: "questions"
                widget: "list"
                label_singular: "Question"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }

  # ── ABOUT ──
  - name: "about"
    label: "👥 About Page"
    files:
      - name: "about"
        label: "About Content"
        file: "data/about.json"
        format: json
        fields:
          - { label: "Page Headline", name: "headline", widget: "string" }
          - { label: "Page Subheadline", name: "sub", widget: "text" }
          - { label: "Company Story", name: "story", widget: "text" }
          - label: "Team Members"
            name: "team"
            widget: "list"
            label_singular: "Team Member"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title / Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  # ── HS BOOKING FORM PAGE ──
  - name: "book_hs"
    label: "📋 HS Booking Form Page"
    files:
      - name: "book_hs"
        label: "High School Booking Page"
        file: "data/book-hs.json"
        format: json
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Headline", name: "headline", widget: "string" }
          - { label: "Page Subheadline", name: "sub", widget: "text" }
          - { label: "Notice Label", name: "notice_label", widget: "string" }
          - { label: "Notice Title", name: "notice_title", widget: "string" }
          - { label: "Notice Line 1", name: "notice_line1", widget: "text" }
          - { label: "Notice Line 2", name: "notice_line2", widget: "text", required: false }
          - { label: "Notice Line 3", name: "notice_line3", widget: "text" }
          - { label: "Form Label", name: "form_label", widget: "string" }

  # ── YOUTH BOOKING FORM PAGE ──
  - name: "book_youth"
    label: "📋 Youth & Club Form Page"
    files:
      - name: "book_youth"
        label: "Youth & Club Booking Page"
        file: "data/book-youth.json"
        format: json
        fields:
          - { label: "Page Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Page Headline", name: "headline", widget: "string" }
          - { label: "Page Subheadline", name: "sub", widget: "text" }
          - { label: "Notice Label", name: "notice_label", widget: "string" }
          - { label: "Notice Title", name: "notice_title", widget: "string" }
          - { label: "Notice Line 1", name: "notice_line1", widget: "text" }
          - { label: "Notice Line 2", name: "notice_line2", widget: "text", required: false }
          - { label: "Notice Line 3", name: "notice_line3", widget: "text" }
          - { label: "Form Label", name: "form_label", widget: "string" }

  # ── PRICING ──
  - name: "pricing"
    label: "💰 Pricing"
    files:
      - name: "media_day_pricing"
        label: "Media Day Pricing"
        file: "data/pricing-mediaday.json"
        format: json
        fields:
          - label: "Pricing Tiers"
            name: "tiers"
            widget: "list"
            label_singular: "Tier"
            fields:
              - { label: "Roster Size", name: "range", widget: "string" }
              - { label: "Price Per Athlete", name: "price", widget: "string" }
              - { label: "Notes", name: "notes", widget: "string", required: false }
      - name: "banner_pricing"
        label: "Pro Banner Pricing"
        file: "data/pricing-banners.json"
        format: json
        fields:
          - label: "Banner Sizes & Prices"
            name: "bulk"
            widget: "list"
            label_singular: "Size"
            fields:
              - { label: "Banner Size", name: "size", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Notes", name: "notes", widget: "string", required: false }
          - { label: "Non-Bulk Upcharge", name: "nonbulk_upcharge", widget: "string" }
          - { label: "Turnaround Time", name: "turnaround", widget: "string" }
          - { label: "Shipping Note", name: "shipping", widget: "string" }
      - name: "team_media_pricing"
        label: "Team Media Image Pricing"
        file: "data/pricing-teammedia.json"
        format: json
        fields:
          - label: "Per-Image Tiers"
            name: "tiers"
            widget: "list"
            label_singular: "Tier"
            fields:
              - { label: "Quantity Range", name: "range", widget: "string" }
              - { label: "Price Per Image", name: "price", widget: "string" }
          - label: "Add-Ons"
            name: "addons"
            widget: "list"
            label_singular: "Add-On"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "desc", widget: "string" }

  # ── CONTACT INFO ──
  - name: "contact"
    label: "📞 Contact Info"
    files:
      - name: "contact"
        label: "Contact Details"
        file: "data/contact.json"
        format: json
        fields:
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Phone Display Format", name: "phone_display", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Instagram Handle", name: "instagram", widget: "string" }
          - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "City & State", name: "location", widget: "string" }
