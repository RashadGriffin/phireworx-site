# ── BUILD ──
# Writes /admin content, reviews, structured data, sitemap.xml and llms.txt
# into the pages before each deploy (see _build/prerender.py).
[build]
  publish = "."
  command = "python3 _build/prerender.py"

# ── CLEAN URL REDIRECTS ──

# Service pages
[[redirects]]
  from = "/pictureday"
  to = "/photo-day.html"
  status = 200

[[redirects]]
  from = "/photoday"
  to = "/photo-day.html"
  status = 200

[[redirects]]
  from = "/media"
  to = "/media-day.html"
  status = 200
[[redirects]]
  from = "/media-success"
  to = "/media-success.html"
  status = 200

[[redirects]]
  from = "/teammedia-success"
  to = "/teammedia-success.html"
  status = 200

[[redirects]]
  from = "/banner-success"
  to = "/banner-success.html"
  status = 200

[[redirects]]
  from = "/mediaday/book"
  to = "/mediaday-book.html"
  status = 200

[[redirects]]
  from = "/mediaday"
  to = "/media-day.html"
  status = 200

[[redirects]]
  from = "/book"
  to = "/booking.html"
  status = 200

[[redirects]]
  from = "/reviews"
  to = "/testimonials.html"
  status = 200

# Direct-link only pages
[[redirects]]
  from = "/about-preview"
  to = "/about-preview.html"
  status = 200

[[redirects]]
  from = "/sessions"
  to = "/private-sessions.html"
  status = 200

[[redirects]]
  from = "/teammedia"
  to = "/team-media-images.html"
  status = 200

[[redirects]]
  from = "/book/youth"
  to = "/book-youth.html"
  status = 200

[[redirects]]
  from = "/book/hs"
  to = "/book-hs.html"
  status = 200

[[redirects]]
  from = "/banners/templates"
  to = "/banner-templates.html"
  status = 200

[[redirects]]
  from = "/banners/form"
  to = "/banners-bulk.html"
  status = 200

[[redirects]]
  from = "/banners/smallform"
  to = "/banners/form"
  status = 301
  force = true

[[redirects]]
  from = "/banners-small.html"
  to = "/banners/form"
  status = 301
  force = true

# Build script is not part of the site
[[redirects]]
  from = "/_build/*"
  to = "/404.html"
  status = 404
  force = true

# Repo housekeeping files are not part of the site
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_partials.html"
  to = "/404.html"
  status = 404
  force = true

# ── 404 CATCH-ALL ──
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── CACHE HEADERS ──
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
